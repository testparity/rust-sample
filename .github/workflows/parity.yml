name: Parity Sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches breakage from new dependency releases and advisories.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Generate base coverage report
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run sample tests
        run: cargo test --locked

      - name: Setup PHP for Parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, fileinfo, json

      - name: Remove stale coverage evidence
        run: |
          rm -rf -- .parity
          test ! -e parity-coverage.json

      - name: Generate baseline report
        id: parity-baseline
        uses: testparity/actions@30a4e2de4295df73868d1d184ff704f0dad3de2e # baseline regression gate
        with:
          post-on-pr: 'false'
          show-tests: 'true'
          fail-on-findings: 'false'

      - name: Stage baseline report
        env:
          REPORT_DIRECTORY: ${{ steps.parity-baseline.outputs.report-directory }}
        run: |
          test -s "$REPORT_DIRECTORY/report.json"
          cp "$REPORT_DIRECTORY/report.json" parity-baseline.json

      - name: Upload base report
        uses: actions/upload-artifact@v4
        with:
          name: parity-base-evidence
          path: parity-baseline.json
          if-no-files-found: error
          retention-days: 14

  parity:
    name: Install and run Parity
    needs: baseline
    if: ${{ !cancelled() && (needs.baseline.result == 'success' || needs.baseline.result == 'skipped') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.parity-upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run sample tests
        run: cargo test --locked

      - name: Setup PHP for Parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, fileinfo, json

      - name: Remove stale coverage evidence
        run: |
          rm -rf -- .parity
          test ! -e parity-coverage.json

      - name: Download base report
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: parity-base-evidence
          path: .parity/baseline

      - name: Run TestParity
        id: parity-report
        uses: testparity/actions@30a4e2de4295df73868d1d184ff704f0dad3de2e # baseline regression gate
        with:
          post-on-pr: 'false'
          show-tests: 'true'
          baseline-report: ${{ github.event_name == 'pull_request' && '.parity/baseline/parity-baseline.json' || '' }}

      - name: Stage TestParity reports
        id: stage-parity
        if: ${{ !cancelled() && steps.parity-report.outputs.report-directory != '' }}
        env:
          REPORT_DIRECTORY: ${{ steps.parity-report.outputs.report-directory }}
        run: |
          test -s .parity/per-test/index.json
          cp "$REPORT_DIRECTORY/report.md" parity-comment.md
          cp "$REPORT_DIRECTORY/report.json" parity-result.json
          if [ -f "$REPORT_DIRECTORY/baseline-comparison.json" ]; then
            cp "$REPORT_DIRECTORY/baseline-comparison.json" parity-baseline-comparison.json
          fi

      - name: Upload fresh Parity evidence
        id: parity-upload
        if: ${{ !cancelled() && steps.stage-parity.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-per-test-evidence
          path: |
            .parity/per-test
            parity-result.json
            parity-comment.md
            parity-baseline-comparison.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  parity-comment:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.parity.outputs.artifact-id != '' }}
    needs: parity
    permissions:
      pull-requests: write
    uses: testparity/actions/.github/workflows/parity-comment.yml@30a4e2de4295df73868d1d184ff704f0dad3de2e # baseline regression gate
    with:
      artifact-name: parity-per-test-evidence
      report-path: parity-comment.md
