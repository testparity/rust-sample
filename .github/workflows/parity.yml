name: Parity Sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches breakage from new dependency releases and advisories.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Install and run Parity
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.parity-upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run sample tests
        run: cargo test --locked

      - name: Setup PHP for Parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, fileinfo, json

      - name: Remove stale coverage evidence
        run: |
          rm -rf -- .parity
          test ! -e parity-coverage.json

      - name: Run TestParity
        id: parity-report
        uses: testparity/actions@10454fb309cc104296ec001fade186d9330abe65 # v1.1.0
        with:
          post-on-pr: 'false'
          show-tests: 'true'

      - name: Stage TestParity reports
        id: stage-parity
        if: ${{ !cancelled() && steps.parity-report.outputs.report-directory != '' }}
        env:
          REPORT_DIRECTORY: ${{ steps.parity-report.outputs.report-directory }}
        run: |
          test -s .parity/per-test/index.json
          cp "$REPORT_DIRECTORY/report.md" parity-comment.md
          cp "$REPORT_DIRECTORY/report.json" parity-result.json

      - name: Upload fresh Parity evidence
        id: parity-upload
        if: ${{ always() && hashFiles('parity-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-per-test-evidence
          path: |
            .parity/per-test
            parity-result.json
            parity-comment.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  parity-comment:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.parity.outputs.artifact-id != '' }}
    needs: parity
    permissions:
      pull-requests: write
    uses: testparity/actions/.github/workflows/parity-comment.yml@10454fb309cc104296ec001fade186d9330abe65 # v1.1.0
    with:
      artifact-name: parity-per-test-evidence
      report-path: parity-comment.md
